# The gates, run in public, on every projection.
#
# ◆ This is what makes "Don't trust this README. Run it." checkable by a stranger without
#   cloning: the run log shows the same pass / fail / skip counts they would get locally.
# ⚠️ A skipped gate is not a pass. The suite exits 0 on skips by design, so a green check
#   here means "nothing failed", not "everything ran". The counts are in the job summary.
name: gates

on:
  push:
  workflow_dispatch:

jobs:
  gates:
    name: seven gates (skips are not passes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: versions
        run: rustc --version && node --version && python3 --version

      # Gate ⑤ drives a real browser and clicks a real page. That is the claim; so install one.
      - name: browser for the projection gate
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: run the gates
        id: gates
        run: |
          set -o pipefail
          bash symbolon/promote.sh 2>&1 | tee /tmp/gates.log

      # 🔴 A green check is not enough. On 2026-09-05 this workflow went green while the
      #    claims gate had silently skipped all 55 of its checks, because the tool it fires
      #    was not where it looked. Passing is not the same as having run.
      #    So: assert the expected *shape*, not just the absence of failures.
      - name: the shape must be what we expect (a green check is not evidence)
        if: always()
        run: |
          line=$(grep -E '^通過 [0-9]+ / 落ち [0-9]+ / 保留 [0-9]+' /tmp/gates.log | tail -1)
          echo "$line"
          pass=$(sed -E 's/^通過 ([0-9]+).*/\1/' <<<"$line")
          fail=$(sed -E 's/.*落ち ([0-9]+).*/\1/' <<<"$line")
          skip=$(sed -E 's/.*保留 ([0-9]+)$/\1/' <<<"$line")
          bad=0
          [ "${fail:-1}" -eq 0 ] || { echo "::error::a gate failed"; bad=1; }
          # Exactly three gates cannot run in public: the deterministic counter (needs a
          # sister runtime that is not published), isolation (only means something in the
          # source tree), and the claims gate (which depends on the counter for 5 of its rows).
          [ "${skip:-9}" -le 3 ] || { echo "::error::more gates skipped than the three that cannot run here — something degraded silently"; bad=1; }
          [ "${pass:-0}" -ge 4 ] || { echo "::error::fewer gates ran than expected"; bad=1; }
          exit "$bad"

      - name: report the counts, including what did not run
        if: always()
        run: |
          {
            echo '## Gate results'
            echo
            echo '```'
            grep -E '^(門|  ✓|  ·|  ✗|       |通過|✅|⏸|⛔)' /tmp/gates.log || cat /tmp/gates.log
            echo '```'
            echo
            echo '⚠️ Three gates cannot run in public, and are reported as skipped, never as passed:'
            echo '- **determinism** — needs a sister runtime that is not published'
            echo '- **isolation** — only means something in the source tree, which is not here'
            echo '- **claims** — re-derives 50 of its 55 rows; the other 5 come from the counter above'
            echo
            echo 'The step before this one fails the run if the shape differs from that.'
            echo 'A green check on its own is not evidence that anything ran.'
          } >> "$GITHUB_STEP_SUMMARY"
